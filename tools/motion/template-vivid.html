<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>HIKARY 모션 템플릿 · 생생</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&display=block">
<style>
/* 생생 (템플릿 6, 2026-11-16 — 투어(템플릿 5, template-tour.html)에서 갈라졌다. 사람: "6번으로 하고 김, 물결, 반짝임 뿐 아니라 컨텐츠에 맞게 적절한 효과").
   투어에 1차 개선(따뜻한 물 첫 컷 · 퀴즈 아닌 첫 한마디 · 15~20초)과 사진 속 실제 것에 맞춘 움직임 효과(아래 표)를 더했다. 커버는 template-vivid-cover.html.
   숙소를 짧게 도는 영상. 사진이 주인공이고 꾸밈은 적다 — 화면 가운데 자막 한 줄이 기본.
   실내는 2.5D(사진 한 장을 깊이대로 움직여 카메라가 지나가는 것처럼, tools/motion/depth.mjs), 바깥은 CSS 카메라. AI는 깊이만 읽고 픽셀은 새로 만들지 않는다.
   글씨체·색·고지·효과음·나레이션은 사진 템플릿(4번)과 같다. 경험담처럼 쓰지 않는다 (CLAUDE.md 3장).
   1차 개선 (2026-11-16, 사람 승인): 유튜브 「계속 시청함」이 252~259 모두 16~23%라 첫 장면을 바꿨다. 잘 되는 숙소 릴스(스터디 S23·S27~S32)는
     따뜻한 물·김이 첫 장면, 퀴즈가 아닌 첫 한마디, 가운데 한 줄 자막, 14~28초였다 — 연출만 참고하고 문장은 상품마다 새로 쓴다.
     퀴즈(「여기 어디게?」「어딘지 궁금하면?」)와 쿠팡 후기 카드 장면을 뺐다 (후기는 게시글로). 업체 이름은 화면·나레이션·게시글에서 계속 숨긴다.
   쓰는 법: contents/<폴더>/motion.html로 복사 → 사진을 photo-1.jpg…로 옆에 두고 ph 클래스를 뺀다 → 「…」 자리를 상품 페이지 사실로 바꾼다 →
     node tools/motion/record.mjs contents/<폴더>/motion.html   → motion.mp4 + motion-bgm.mp4 (2.5D 프레임은 <폴더>/depth/에 처음 한 번 만든다)
   대본 틀 (숙소 상품, 17.5초 — 기본 15~20초. 장면을 더하거나 빼면 --at·--len, 나레이션 줄, data-sfx를 같이 옮긴다):
     | 시간       | 장면                                    | 움직임                 | 화면                                  |
     | 0~1.4      | 따뜻한 물·김·불 (온천·노천탕·온수풀·불멍) | 2.5D in (세기 .7) + 물이면 김·물결 | 첫 한마디가 0초부터 가운데 크게 (착지), 고지 |
     | 1.4~2.8    | 두 번째로 센 컷 (물이면 더 좋다)         | 2.5D 또는 CSS 당기기   | 첫 한마디 그대로                      |
     | 2.8~10.6   | 객실·시설 세 컷, 2.6초씩                 | 실내 2.5D · 바깥 CSS   | 작은 말 / 큰 낱말 — 수 A·B·C는 저절로 (이름표·조건은 꼭 필요할 때만) |
     | 10.6~13.0  | 한 컷 더 (주변·시설)                     | CSS                    | 작은 말 / 큰 낱말 — D 뚫고 지나감      |
     | 13.0~17.5  | 전체 모습 (밤 외관 멀어지기) → 격자 한 칸 | CSS                    | 영상 컷 격자 + 끝 부탁 + 프로필 링크, 고지 |
     물이 없는 숙소면 첫 컷은 가장 센 한 장 (불멍·풍경·수영장).
   첫 한마디 (0초, 두 줄, 한 줄에 7자 안쪽) — 세 꼴 중 하나로 상품마다 새로 쓴다:
     상황형 「~하고 싶을 때」「추운 날, 소나무 아래 온천」 · 놀람형 「여기가 한국?」 꼴 (사실일 때만 — 과장·확인 안 된 비교 금지) ·
     좋은 것 두 개 「노천탕 앞에서 바비큐」 꼴 (상품 페이지에 둘 다 있을 때). 「어디게?」 같은 퀴즈 말은 쓰지 않는다.
   2.5D 사진 (<img class="depth" data-depth="in">): 움직임 in·out·left·right·up·down, 세기 data-strength(기본 1, 0.5 약하게 ~ 2).
     구도는 object-position을 %로만. 가로 1920 사진을 세로 화면에 채우면 가로 31.6%만 보인다 — 보일 가운데가 사진 가로 f(0~1)이면 x% = (f − 0.158) ÷ 0.684.
     img에 CSS 움직임을 주지 않는다 (움직임은 프레임에 들어 있다). 브라우저 미리보기에서는 멈춘 사진으로 보인다.
     맞는 사진: 단순한 바탕(벽·바닥·하늘) 앞에 물체 하나 — 거실·침실·주방·욕실·실내 온천, 테이블 위 소품. 가로 1920px 이상.
     피할 사진: 난간·나뭇가지·울타리가 복잡한 바탕 앞에 있는 사진(기둥 옆이 늘어나 일렁인다 → 테라스·바베큐·숲은 CSS로),
       사람이 나오는 사진, 작은 사진. 밤 외관처럼 난간이 앞에 있으면 세기를 .7 아래로 줄이고 프레임을 보고 정한다.
   CSS 카메라 .cam: 사진 템플릿과 같다 (--w×--h, (--x0,--y0,--s0) → (--x1,--y1,--s1), 당기고 밀 때 가운데 --o). 1920×1080 사진은 --w:3413px;--h:1920px,
     가운데 f를 보이려면 --x = −(f × 3413 − 540), 범위 0 ≥ --x ≥ −2333. 작은 사진(가로 1400 안팎)은 가로 띠(.strip) + 같은 사진 흐린 바탕.
   글씨는 x 60~900, y 200~1480 안에 (가운데는 x 480). 고지는 첫 장면과 마지막 장면 위쪽(.disc). 이름이 크게 보이는 사진(간판·로고)은 피한다.
   자막 타이포 (2026-11-18, 스터디 S45 시험 1~3차 — 사람: "좋네~ㅎ"): 작은 주아 한 줄(.small) + 큰 낱말 한 줄(.big, Black Han Sans). 크기 대비가 핵심이다.
     자막은 「작은 말 / 큰 낱말」 두 줄로 나눠 쓴다. 큰 낱말은 네 글자 안쪽(띄어쓰기 빼고). 나레이션 줄과 같은 시각에 바뀌고, 읽는 말과 같게 짧게 쓴다.
     큰 낱말 크기 --fs: 두 글자 250px · 세 글자 220px(기본) · 네 글자 170px. 숫자·기호(「1~2분」)는 좁으니 가로 840px 안에 들면 한 단계 키워도 된다.
     형광펜: 큰 낱말을 <em>으로 감싸면 포인트 색 띠가 글자 아래에 쓸린다. 띠 위 글자는 흰색이라 포인트가 밝은 색(연분홍·연노랑)이면 묻힌다 — 진한 포인트를 고른다.
       띠가 그 컷 사진과 같은 색이어도 묻힌다 (262 주황 계단 위 주황 띠) — 그 컷은 --y로 다른 색 위에 둔다.
     움직임(수) — 장면마다 하나. 들어올 때도 나갈 때도 움직이고, 큰 낱말은 들어온 뒤 0.4초 안에 읽힌다:
       | 클래스        | 수            | 들어올 때 → 나갈 때                                       | 어디에                                    |
       | .ask.land     | 착지          | 0초에 125%로 꽉 찼다가 내려앉음 → 위로 튕겨 나감           | 첫 장면 — 고정 (0초 프레임에 글자가 다 보인다, 훅 규칙 ①) |
       | .say.slam     | A 쿵          | 위에서 떨어져 쿵, 찌그러졌다 펴짐 → 아래로 떨어짐           | 가운데 장면 — 저절로                       |
       | .say.fly      | B 날아옴      | 글자마다 다른 방향·회전으로 날아와 맞춰짐 → 왼쪽으로 밀려남 | 가운데 장면 — 저절로 (세 글자 이하·2초 이상만) |
       | .say.rise     | C 솟아오름    | 흰 선 아래에서 솟음 → 선 아래로 다시 들어감                 | 가운데 장면 — 저절로                       |
       | .say.through  | D 뚫고 지나감 | 툭 튀어나옴 → 끝 0.42초에 6배로 커지며 다음 장면으로        | 끝 장면(모아 보기 격자) 바로 앞 컷 — 고정  |
     **가운데 장면의 수는 저절로 정해진다** (2026-11-18, 배경음악처럼): .say에 수를 적지 않으면 맨 아래 script가 폴더 이름을 씨앗으로
       A·B·C 순서를 정한다 — 같은 수를 잇지 않고, B는 큰 낱말이 세 글자 이하이고 장면이 2초 이상일 때만. B 글자가 날아오는 방향도 씨앗으로 정한다.
       형광펜은 늘 반듯하다 (0도 — 2026-11-19 사람: "반듯한게 좋을꺼 같애". 그 전에는 씨앗으로 ±3도 기울었다).
       같은 폴더는 다시 녹화해도 같고, 폴더가 다르면 달라진다. 컨텐츠팀은 고르지 않는다.
       꼭 바꾸고 싶으면: ① 다른 조합을 보려면 <body data-typo="아무 글자">로 씨앗만 바꾼다 ② 한 장면만 정하려면 그 .say에 slam·fly·rise를 직접 적는다 (적은 것은 그대로 두고 나머지만 고른다).
       브라우저 미리보기에도 같은 수가 보인다.
     밝은 사진(흰 벽·흰 침구·하늘) 위에서는 흰 큰 글자가 덜 또렷하다 → ① --y로 글자를 사진의 어두운 자리(바다·나무·가구 앞)로 옮기고
       ② 그래도 흐리면 .say에 dark를 더해 그림자를 진하게 한다 (class="say dark") ③ 그래도 안 되면 그 컷은 큰 낱말 장면으로 쓰지 않는다.
     이름표(.label)·작은 조건(.sub)은 꼭 필요한 컷에만. 맨 아래 script는 지우지 않는다 (수 고르기 · 효과음 · 큰 낱말 글꼴 받아 두기).
   효과음 <body data-sfx>: 여기에는 첫 장면·컷·끝 장면 소리만 적는다 — 착지 thud .6을 0.18초에 · 컷마다 swoosh .45를 컷 시각에
     (0.14~0.16초 뒤에 가장 크다. 1.4초 컷은 thud .45) · 끝 장면 컷은 whoosh .75 · 끝 격자 ding·swoosh·pop. 장면 시각을 바꾸면 이 목록도 같이 고친다.
     가운데 장면의 이름표 pop·A 쿵 thud·C 솟음 swoosh·D 튀어나옴 pop은 맨 아래 script가 정해진 수에 맞춰 더한다 (B는 컷 swoosh가 맡는다).
     녹화(record.mjs)는 더해진 목록을 페이지에서 읽는다. 소리만 다시 넣는 sfx.mjs는 HTML 글만 읽어 script가 더한 소리를 모른다 — 소리를 고치면 다시 녹화한다.
   첫 3초 규칙 (2026-11-13): ① 0초 프레임부터 첫 한마디 전체를 크게 (나타나는 애니메이션 없이 — 착지는 0초에 이미 다 보여서 된다) ② 첫 장면은 화면 가득 가장 센 사진
     ③ 첫 3초 안에 블러 전환 없음 (.shot.cut) ④ 1~1.5초 안에 장면이 한 번 바뀐다 ⑤ 고지 줄은 0초부터 맨 위. 나레이션 첫 줄은 0.15초부터 첫 한마디를 그대로 읽는다.
   끝 부탁: 「프로필 링크 No.」은 유튜브·틱톡도 같은 영상이라 그대로 둔다. DM 줄은 인스타만 되니 「인스타는」을 앞에 붙인다 (유튜브·틱톡 댓글엔 DM이 가지 않는다).
   나레이션 표 예시 (narration.md, 1초에 5음절쯤 — 1.7B는 조금 느리니 줄을 짧게):
     | 0.15–2.65  | 첫 한마디         | (화면 그대로) |
     | 2.95–5.25  | 객실              | 사실 한 줄    |
     | 5.55–7.85  | 시설 1            | 사실 한 줄    |
     | 8.15–10.45 | 시설 2            | 사실 한 줄    |
     | 10.75–12.85| 시설 3 · 주변     | 사실 한 줄    |
     | 13.2–17.2  | 밤 외관 · 끝 부탁 | 숙소 정보는 프로필 링크, ○○○번! | */
/* 색: 상품에 맞춰 이 블록만 바꾼다 (CLAUDE.md §4 · 후보는 node tools/colors.mjs).
   포인트 --point(형광펜 띠·이름표·링크 알약 — 진한 색) · --on-point(이름표·알약 위 글자) · --hi(커버의 큰 노란 글자 — 영상에서는 안 쓴다) · --night(바탕) */
:root{
  --point:#e8312f;
  --on-point:#fff;
  --hi:#ffe14d;
  --night:#050a2d;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{position:relative;background:var(--night);font-family:Jua,sans-serif;font-synthesis:none;color:#fff;letter-spacing:-.5px;word-break:keep-all}
em,i{font-style:normal}
/* 사진 자리 표시 (CSS 카메라만): 사진을 넣으면 ph 클래스를 뺀다. 2.5D img는 사진 파일이 옆에 있어야 녹화된다 */
.ph::after{content:attr(data-label) " 자리";position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.08);color:rgba(255,255,255,.5);font-size:44px}

.scene{position:absolute;inset:0;opacity:0;animation:show var(--len) linear var(--at)}
@keyframes show{from,to{opacity:1}}
.up,.pop,.fade{animation-duration:.6s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;animation-delay:calc(var(--at) + var(--d,0s))}
.up{animation-name:up}     @keyframes up{from{opacity:0;transform:translateY(50px)}}
.pop{animation-name:pop;animation-timing-function:cubic-bezier(.3,1.6,.5,1)} @keyframes pop{from{opacity:0;transform:scale(.3)}}
.fade{animation-name:fade} @keyframes fade{from{opacity:0}}

/* 컷 하나 = 사진 한 장. 들어올 때 잠깐 흐렸다가 또렷해진다. ::after는 고지(위)·자막(가운데)·플랫폼 글자(아래) 자리만 살짝 어둡게 */
.shot{position:absolute;inset:0;overflow:hidden;opacity:0;animation:show var(--len) linear var(--at),whip .35s cubic-bezier(.2,.8,.2,1) var(--at) both}
.shot.cut{animation:show var(--len) linear var(--at)} /* 블러 없이 바로 바뀌는 컷 — 첫 3초는 이것만 */
.shot::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.4),transparent 17%,transparent 36%,rgba(0,0,0,.28) 48%,rgba(0,0,0,.28) 56%,transparent 68%,transparent 84%,rgba(0,0,0,.4))}
@keyframes whip{from{filter:blur(22px) brightness(1.3)}}
.depth{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam{position:absolute;left:0;top:0;width:var(--w);height:var(--h);background:var(--img) 0 0/100% 100% no-repeat;transform-origin:var(--o,0 0);
  animation:cam var(--len) cubic-bezier(.35,0,.65,1) var(--at) both}
@keyframes cam{from{transform:translate(var(--x0,0px),var(--y0,0px)) scale(var(--s0,1))}to{transform:translate(var(--x1,0px),var(--y1,0px)) scale(var(--s1,1))}}
.cam.soft{filter:blur(8px) brightness(.45)}
.cam.lin{animation-timing-function:linear} /* 끝 장면: 마지막 프레임까지 같은 빠르기로 */
/* 작은 사진은 가로 띠로 (같은 사진 .cam.soft를 바탕에 깐다) */
.strip{position:absolute;left:0;width:1080px;height:var(--sh);top:var(--top);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:stripin .45s cubic-bezier(.2,.8,.2,1) calc(var(--at) + var(--d,0s)) both}
@keyframes stripin{from{transform:translateX(var(--from,0px))}}

/* 위: 고지 */
.disc{position:absolute;left:60px;width:840px;top:200px;padding:12px 22px 10px;border-radius:18px;background:rgba(0,0,0,.5);color:rgba(255,255,255,.92);font-size:26px;line-height:1.4}
/* 가운데: 첫 한마디(첫 장면) · 자막 = 작은 주아 한 줄(.small) + 큰 낱말 한 줄(.big, Black Han Sans) (+ 꼭 필요할 때 이름표·작은 조건).
   쓰는 법·크기·수 고르기는 머리 주석 「자막 타이포」 */
.ask,.line,.sub{text-shadow:0 0 3px rgba(0,0,0,.9),0 3px 10px rgba(0,0,0,.7),0 0 30px rgba(0,0,0,.45)}
.ask{position:absolute;left:60px;width:840px;top:var(--y,760px);text-align:center;font-size:104px;line-height:1.12}
.ask b{display:block;font-weight:400;animation:up var(--dur,.5s) cubic-bezier(.2,.8,.2,1) var(--t) both}
.say{position:absolute;left:60px;width:840px;top:var(--y,760px);text-align:center}
.label{display:inline-block;padding:12px 32px 6px;border-radius:999px;background:var(--point);color:var(--on-point);font-size:48px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.line{margin-top:16px;line-height:1.15}
.ask .small{font-size:90px}
.line.small{font-size:72px}
.big{font-family:'Black Han Sans',sans-serif;font-size:var(--fs,220px);line-height:1;letter-spacing:-.02em}
.line.big{margin-top:6px}
.sub{margin-top:14px;font-size:40px;color:rgba(255,255,255,.94)}
.say.dark .line{text-shadow:0 0 4px rgba(0,0,0,.95),0 4px 16px rgba(0,0,0,.8),0 0 60px rgba(0,0,0,.65)} /* 밝은 사진 위 */
.say .label{animation:pop .45s cubic-bezier(.3,1.6,.5,1) calc(var(--at) + var(--d,0s)) both}
.say .sub{animation:fade .5s ease calc(var(--at) + var(--d,0s) + .8s) both}
/* 형광펜: 큰 낱말 <em> 뒤 띠(::before)가 0.18초에 쓸린다 — 글자 아래 42%, 반듯하게 (2026-11-19, 그 전에는 ±3도). --e = 띠가 들어오는 때 (수마다 기본값) */
.big em{position:relative;isolation:isolate;display:inline-block;padding:0 .06em;margin:0 -.03em}
.big em::before{content:"";position:absolute;z-index:-1;left:-.02em;right:-.02em;top:47%;height:42%;border-radius:.05em;background:var(--point);
  transform:scaleX(0);transform-origin:0 50%;animation:band .18s cubic-bezier(.5,0,.2,1) calc(var(--at) + var(--d,0s) + var(--e,.5s)) both}
@keyframes band{to{transform:scaleX(1)}}
/* 움직임(수). 들어오는 움직임은 안쪽(.big·.c·em)에, 나가는 움직임은 바깥 상자(.ask·.say)에 — 한 요소에 transform 애니메이션 둘이 겹치지 않게.
   나가기는 장면 끝(--at + --len) 0.22~0.42초 전에 시작하고 forwards로만 채운다 */
/* 착지 (첫 장면): 0초에 125%로 꽉 차 있다가(0초 프레임에 글자가 다 보인다) 0.36초에 찌그러지며 내려앉음 → 위로 튕겨 나감 */
.ask.land{--e:.22s;animation:outup .24s cubic-bezier(.5,0,1,.5) calc(var(--at) + var(--len) - .26s) forwards}
.ask.land>span{display:block;transform-origin:50% 55%;animation:land .36s linear var(--at) both}
@keyframes land{0%{transform:scale(1.25);animation-timing-function:cubic-bezier(.5,0,.9,.6)}55%{transform:scale(1.04,.9);animation-timing-function:ease-out}78%{transform:scale(.98,1.04)}100%{transform:none}}
@keyframes outup{from{transform:none;opacity:1}to{transform:translateY(-520px) scale(.75);opacity:0}}
/* A 쿵: 위에서 떨어져 0.25초에 쿵 — 찌그러졌다 펴짐 → 아래로 떨어짐 */
.say.slam{--e:.45s;animation:outdown .26s cubic-bezier(.5,0,1,.5) calc(var(--at) + var(--len) - .28s) forwards}
.say.slam .label,.say.slam .small{animation:pop .35s cubic-bezier(.3,1.6,.5,1) calc(var(--at) + var(--d,0s) + .25s) both} /* 떨어지는 낱말이 이름표 위를 지나가지 않게 쿵 뒤에 */
.say.slam .big{transform-origin:50% 85%;animation:slam .52s linear calc(var(--at) + var(--d,0s)) both}
@keyframes slam{0%{transform:translateY(-1050px) scale(.9,1.3);animation-timing-function:cubic-bezier(.55,0,1,.7)}
  48%{transform:translateY(0) scale(1.22,.74);animation-timing-function:cubic-bezier(.2,.8,.3,1)}70%{transform:scale(.95,1.07)}86%{transform:scale(1.02,.98)}100%{transform:none}}
@keyframes outdown{from{transform:none}to{transform:translateY(1150px) rotate(9deg)}}
/* B 날아옴: 글자마다 다른 방향·회전으로 날아와 0.38초 안에 맞춰짐 → 왼쪽으로 밀려남. 세 글자까지.
   글자 나누기(<span class="c">)와 방향(--i·--fx·--fy·--fr)은 맨 아래 script가 씨앗으로 정한다 */
.say.fly{--e:.5s;animation:outleft .22s cubic-bezier(.5,0,1,.5) calc(var(--at) + var(--len) - .24s) forwards}
.say.fly .small{animation:up .3s cubic-bezier(.2,.8,.2,1) calc(var(--at) + var(--d,0s)) both}
.say.fly .c{display:inline-block;animation:flyin .3s cubic-bezier(.2,.9,.3,1.12) calc(var(--at) + var(--d,0s) + .08s + var(--i) * .04s) both}
@keyframes flyin{0%{opacity:0;transform:translate(var(--fx),var(--fy)) rotate(var(--fr)) scale(1.7)}30%{opacity:1}}
@keyframes outleft{from{transform:none}to{transform:translateX(-1300px) skewX(16deg)}}
/* C 솟아오름: 흰 선이 그어지고 그 아래에서 낱말이 솟음 (.big 아래 14% = 글자 바닥 근처에서 자른다) → 선 아래로 다시 들어감 */
.say.rise{--e:.5s}
.say.rise .big{position:relative;clip-path:inset(-40% -30% 14% -30%)}
.say.rise .big::after{content:"";position:absolute;left:50%;bottom:14%;width:620px;height:9px;margin-left:-310px;border-radius:5px;background:#fff;
  transform:scaleX(0);animation:rule .2s cubic-bezier(.3,0,.2,1) calc(var(--at) + var(--d,0s)) both}
@keyframes rule{to{transform:scaleX(1)}}
.say.rise .big em{animation:risein .36s cubic-bezier(.2,.9,.25,1.12) calc(var(--at) + var(--d,0s) + .18s) both,sinkout .2s cubic-bezier(.6,0,1,.6) calc(var(--at) + var(--len) - .24s) forwards}
@keyframes risein{from{transform:translateY(90%)}}
@keyframes sinkout{from{transform:none}to{transform:translateY(90%)}}
.say.rise .label,.say.rise .small,.say.rise .sub{animation-name:pop,outfade;animation-duration:.45s,.2s;animation-timing-function:cubic-bezier(.3,1.6,.5,1),ease-in;
  animation-delay:calc(var(--at) + var(--d,0s)),calc(var(--at) + var(--len) - .24s);animation-fill-mode:both,forwards}
@keyframes outfade{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-50px)}}
/* D 뚫고 지나감: 툭 튀어나옴 → 끝 0.42초에 6배로 커지며 화면을 뚫고 다음 장면(끝 격자)으로. 이름표가 있으면 transform-origin 세로를 큰 낱말 가운데로 고친다 */
.say.through{--e:.4s;transform-origin:50% 66%;animation:through .42s cubic-bezier(.7,0,1,.6) calc(var(--at) + var(--len) - .42s) forwards}
.say.through .small{animation:fade .3s ease calc(var(--at) + var(--d,0s)) both}
.say.through .big{animation:pop .4s cubic-bezier(.3,1.7,.5,1) calc(var(--at) + var(--d,0s) + .05s) both}
@keyframes through{0%{transform:none;opacity:1}60%{opacity:1}100%{transform:scale(6);opacity:0}}

/* 끝: 프로필 링크 */
.link{position:absolute;left:0;width:960px;top:var(--y,1000px);display:flex;justify-content:center;animation-delay:calc(var(--at) + var(--d))}
.link b{display:flex;align-items:center;gap:20px;padding:20px 22px 16px 44px;border-radius:999px;background:var(--point);color:var(--on-point);font-weight:400;font-size:62px;box-shadow:0 20px 50px rgba(0,0,0,.45);transform:rotate(-2deg)}
.link i{display:grid;place-items:center;width:80px;height:80px;border-radius:50%;background:#fff;color:var(--point);font-size:56px;line-height:1;padding-top:6px}
.dm{position:absolute;left:60px;width:840px;top:var(--y,1150px);text-align:center;font-size:34px;color:rgba(255,255,255,.94);text-shadow:0 0 3px rgba(0,0,0,.9),0 3px 10px rgba(0,0,0,.7)}
/* 움직임 효과 (2026-11-16, 사람: "김·물결 반짝임을 코드로 직접 얹기" · "별이나 전등도 반짝반짝" · "컨텐츠에 맞게 적절한 효과").
   AI 없이 CSS로만 — 사진 픽셀은 그대로 두고 위에 겹친다. **사진에 실제로 찍힌 것 위에만** 그것에 맞는 효과를 쓴다:
     | 사진에 찍힌 것                          | 효과                                   | 하지 말 것                                                  |
     | 따뜻한 물 (온천·노천탕·스파·온수풀)      | 김 .steam + 물결 빛 .shimmer            | 차가운 물(수영장·바다)에 김 · 탕을 덮어 윤곽을 가리기        |
     | 물 (수영장·풀빌라 풀·탕의 수면)          | 물결 빛 .shimmer                        | 물 밖(돌턱·바닥)·물 위에 뜬 물건으로 번지게 (--clip으로 자른다) · 거품 많은 흰 물(안 보임) |
     | 밤의 별·창문·조명                        | 반짝임 .lights (lights.mjs가 찾은 자리만) | 손으로 점 찍기 · 없는 별·불빛                                |
     | 불 (불멍·화로·바베큐 숯불)              | 불꽃 일렁임 .fire                        | 불이 안 붙은 화로·그릴 · 불을 키우거나 번지게                  |
     | 나중에 더할 것 — 그 상품이 올 때         | 분수·폭포 물 흐름 · 바다 윤슬 등          |                                                              |
   공통 금지: 사진에 없는 것(눈·비·별·불빛·사람·음식·불)을 새로 만들지 않는다 · 탕·시설 모양을 바꾸거나 가리지 않는다 · AI를 쓰지 않는다
     (CLAUDE.md 3장 「실제와 다른 광고」 · 4장 2.5D 메모 — 특수효과라 AI 표시 대상이 아니라고 본다).
   어디에 두나: 2.5D 컷(img.depth)은 사진 다음 줄에 두고 --push로 카메라가 다가가는 만큼 같이 커지게 한다 (in 움직임이면 1 + .08 × 세기, 예 세기 1 → 1.08).
     CSS 카메라 컷(.cam)은 .cam 안에 두면 카메라를 저절로 따라간다 — 좌표는 .cam 상자 기준 (사진 px × --w ÷ 사진 가로). 띠 사진도 띠의 .cam 안에.
   김   <div class="steam" style="--x:0px;--y:1300px;--w:1080px;--h:240px"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          --x·--y·--w·--h = 김이 피어오를 물 표면. 물 위에 옅은 김이 깔려 숨 쉬듯 일렁이고, 가는 김 줄기 9개가 흔들리며 --rise(기본 320px)만큼 올라 흩어진다.
          세기 --k (기본 .55 · .35 ~ .7). 줄기마다 크기·빠르기·흔들림·진하기가 달라 똑같이 되풀이되지 않고, 0초 프레임에도 이미 올라가고 있다.
          흰 김이라 어두운 물·벽·나무 앞에서 잘 보이고, 햇빛 든 밝은 실내(흰 벽·밝은 물) 앞에서는 거의 안 보인다 — 그런 컷은 물결이 움직임을 맡는다.
     물결 <div class="shimmer" style="--x:0px;--y:1150px;--w:1080px;--h:770px;--clip:polygon(0 0,100% 0,100% 100%,0 100%)"></div>
          상자 = 사진 속 물 전체 (위 끝 = 물의 먼 쪽 끝). 빛 무늬가 상자 전체에 깔리고 위 30%는 흐려지며 끝나니, 상자 위 끝을 물 끝보다 조금 위에 둬도 된다.
          물 모양·물 위에 뜬 튜브 같은 물건은 --clip으로 잘라 낸다 (상자 기준 %). 무늬는 멀수록(위로 갈수록) 작아지고, 두 겹이 다른 쪽으로 쉬지 않고
          흘러가며 번갈아 밝아져서 1.4초 컷에서도 움직임이 보인다. 상자 크기와 상관없이 같은 모양이다 (.cam 안의 사진 좌표 상자도).
          세기 --k (기본 .55). 밝은 파란 타일 물에서도 보인다 — 더 또렷하게 하려면 .6까지. 거품이 많은 흰 물에는 안 보이니 쓰지 않는다 (김만).
     불빛 <div class="lights"><i style="--x:612px;--y:1180px"></i><i style="--x:700px;--y:1210px;--s:44px;--t:3.1s;--dl:-1.2s"></i>…</div>
          사진에 찍혀 있는 불빛·별 자리마다 <i> 하나 (.cam 안이면 .cam 좌표). 크기 --s(기본 36px) · 깜빡임 길이 --t(기본 2.4초) · 시작 --dl을
          점마다 다르게 해서 같은 박자로 깜빡이지 않게 한다. 세기 --k (기본 .85). 자리는 손으로 찍지 않고
          node tools/motion/lights.mjs <사진> <--w> <--h> <보이는 x 시작 = −--x0>  로 사진 속 밝은 점을 찾아 나온 줄을 그대로 붙인다 (확인 그림도 나온다).
     불꽃 <div class="fire" style="--x:1950px;--y:860px;--w:700px;--h:500px"><i></i><i></i><i></i><i></i><i></i><i></i></div>
          상자 = 사진 속 불길이 보이는 자리 (불 바닥이 상자 아래쪽). 불 위의 따뜻한 빛이 고르지 않게 밝아졌다 어두워지고, 불길 자리가 좌우로 살짝 일렁이며,
          작은 불티 6개가 --rise(기본 220px)만큼 올라 사라진다. 세기 --k (기본 .5 · .3 ~ .7). 불길 밖(의자·나무·바닥)으로 빛이 크게 번지지 않게 상자를 불에 맞춘다.
   세기 기준: 김 --k .7 · 물결 .6 · 불꽃 .7을 넘기지 않는다 (사진이 효과에 묻히면 안 된다). --rise는 탕·불 위 벽·하늘까지만. */
.steam,.shimmer{position:absolute;left:var(--x);top:var(--y);width:var(--w);height:var(--h);pointer-events:none;
  transform-origin:calc(540px - var(--x)) calc(960px - var(--y));animation:fxpush var(--len) linear var(--at) both}
@keyframes fxpush{from{transform:scale(1)}to{transform:scale(var(--push,1))}}
/* 김: 물 위에 깔린 옅은 김(::before) + 흔들리며 오르는 줄기 9개 */
.steam::before{content:"";position:absolute;left:-6%;right:-6%;bottom:-8%;height:70%;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,255,255,calc(var(--k,.55) * .55)),rgba(255,255,255,0));filter:blur(20px);
  animation:mist 6.5s ease-in-out -2s infinite alternate}
@keyframes mist{from{opacity:.55;transform:translateX(-3%) scaleY(.85)}to{opacity:1;transform:translateX(3%) scaleY(1.1)}}
.steam i{position:absolute;bottom:var(--b,12%);left:var(--l);width:var(--s);height:calc(var(--s) * 1.5);margin-left:calc(var(--s) / -2);border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,255,255,calc(var(--k,.55) * var(--a,1))),rgba(255,255,255,0));filter:blur(18px);opacity:0;
  animation:wisp var(--t) cubic-bezier(.3,.1,.6,1) var(--dl) infinite}
@keyframes wisp{
  0%{opacity:0;transform:translate(0,0) scale(.45,.35) rotate(0)}
  18%{opacity:1}
  55%{opacity:.75;transform:translate(var(--dx1),calc(var(--rise,320px) * -.5)) scale(.9,.8) rotate(var(--r,6deg))}
  100%{opacity:0;transform:translate(var(--dx2),calc(var(--rise,320px) * -1)) scale(1.7,1.25) rotate(calc(var(--r,6deg) * -1))}}
.steam i:nth-child(1){--l:9%;--s:150px;--t:4.1s;--dl:-.6s;--dx1:22px;--dx2:-10px;--b:8%;--a:.9;--r:7deg}
.steam i:nth-child(2){--l:24%;--s:190px;--t:5.3s;--dl:-3.1s;--dx1:-28px;--dx2:16px;--b:22%;--a:.7;--r:-5deg}
.steam i:nth-child(3){--l:37%;--s:130px;--t:3.6s;--dl:-1.7s;--dx1:14px;--dx2:34px;--b:4%;--a:1;--r:9deg}
.steam i:nth-child(4){--l:51%;--s:210px;--t:5.9s;--dl:-4.4s;--dx1:-18px;--dx2:-40px;--b:18%;--a:.65;--r:-8deg}
.steam i:nth-child(5){--l:63%;--s:160px;--t:4.5s;--dl:-2.2s;--dx1:26px;--dx2:6px;--b:10%;--a:.95;--r:6deg}
.steam i:nth-child(6){--l:77%;--s:180px;--t:4.9s;--dl:-.2s;--dx1:-12px;--dx2:-30px;--b:26%;--a:.75;--r:-6deg}
.steam i:nth-child(7){--l:90%;--s:140px;--t:3.9s;--dl:-2.9s;--dx1:18px;--dx2:28px;--b:6%;--a:.85;--r:8deg}
.steam i:nth-child(8){--l:44%;--s:120px;--t:3.3s;--dl:-1.1s;--dx1:-10px;--dx2:20px;--b:30%;--a:.6;--r:-9deg}
.steam i:nth-child(9){--l:70%;--s:125px;--t:3.8s;--dl:-3.5s;--dx1:12px;--dx2:-16px;--b:2%;--a:1;--r:5deg}
/* 물결: 노이즈 등고선(이음매 없는 SVG 타일) 두 겹을 물 위에 눕혀 깐다 — 위(먼 쪽)로 갈수록 작다. 두 겹이 다른 쪽으로 흘러가며 번갈아 밝아진다.
   2026-11-17 고침: 52도로 눕힌 판이 상자 맨 아래 띠(200~350px)에만 그려지고 위 끝이 직선으로 끊겼다 · 9~12초 주기라 1.4초 컷에서 멈춰 보였다.
   이제 판의 원근(perspective)과 높이를 상자 높이(cqh)에 맞춰서 상자가 크든 작든(.cam 안의 큰 상자도) 상자 전체에 깔리고,
   위 30%는 흐려지며 끝나고 양옆 6%도 흐려진다. 흐름은 멈추지 않는 등속(6초·8초에 한 바퀴), 밝기는 1.7초·2.3초 박자로 번갈아 바뀐다. */
.shimmer{overflow:hidden;clip-path:var(--clip,none);mix-blend-mode:screen;container-type:size;
  -webkit-mask-image:linear-gradient(transparent,#000 30%),linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);-webkit-mask-composite:source-in;
  mask-image:linear-gradient(transparent,#000 30%),linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-composite:intersect}

<!-- 타이포 수 정하기 (2026-11-18, 사람 승인: "배경음악처럼 폴더 이름에 따라 저절로 달라지게 … 이렇게 하자"). 지우지 않는다.

     ① (예전 형광펜 기울기 자리 — 2026-11-19부터 반듯) ② 수를 적지 않은 .say에 A(slam)·B(fly)·C(rise)를 붙인다 — 같은 수를 잇지 않고, B는 큰 낱말 세 글자 이하·장면 2초 이상만

<script>
(() => {
  const body = document.body, sec = v => parseFloat(v) || 0, r2 = t => +t.toFixed(2);

  let h = 2166136261;
  for (const ch of seed) h = Math.imul(h ^ ch.codePointAt(0), 16777619);
  const rnd = () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296; };
  rnd(); // 예전 형광펜 기울기를 뽑던 자리. 지우면 뒤의 수 순서·날아오는 방향이 폴더마다 바뀌니 그대로 한 번 뽑고 버린다 (2026-11-19)
  const order = ['slam', 'fly', 'rise'];
  for (let i = 2; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  const cues = [];
  let prev = '', k = 0;
  for (const say of document.querySelectorAll('.say')) {
    const cs = getComputedStyle(say), at = sec(cs.getPropertyValue('--at')), d = sec(cs.getPropertyValue('--d')), len = sec(cs.getPropertyValue('--len'));
    const em = say.querySelector('.big em'), letters = em ? em.textContent.replace(/\s/g, '').length : 0;
    let move = ['slam', 'fly', 'rise', 'through'].find(m => say.classList.contains(m));
    if (!move) {
      move = [...order.slice(k % 3), ...order.slice(0, k % 3)].find(m => m !== prev && (m !== 'fly' || (letters <= 3 && len >= 2)));
      k++;
      say.classList.add(move);
    }
    if (move === 'fly' && em) {
      if (!em.querySelector('.c')) {
        const text = em.textContent; em.textContent = '';
        for (const c of text) em.append(c.trim() ? Object.assign(document.createElement('span'), { className: 'c', textContent: c }) : c);
      }
      const base = rnd() * 360;
      em.querySelectorAll('.c').forEach((c, i) => {
        const a = (base + i * 120 + (rnd() - .5) * 50) * Math.PI / 180, r = 650 + rnd() * 150;
        c.style.cssText += `--i:${i};--fx:${Math.round(Math.cos(a) * r)}px;--fy:${Math.round(Math.sin(a) * r)}px;--fr:${Math.round((rnd() < .5 ? -1 : 1) * (100 + rnd() * 120))}deg`;
      });
    }
    if (say.querySelector('.label') && move !== 'slam') cues.push(`${r2(at + d)} pop .3`); // A는 이름표가 쿵 뒤에 나와 쿵이 맡는다
    if (move === 'slam') cues.push(`${r2(at + d + .25)} thud .65`);
    if (move === 'rise') cues.push(`${r2(at + d + .18)} swoosh .3`);
    if (move === 'through') cues.push(`${r2(at + d + .03)} pop .4`);
    prev = move;
  }
  body.dataset.sfx = [body.dataset.sfx, ...cues].filter(Boolean).join(', ');
  document.fonts.load("220px 'Black Han Sans'", [...document.querySelectorAll('.big')].map(e => e.textContent).join(''));
})();
</script>
</body></html>
