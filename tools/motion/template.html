<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>HIKARY 모션 템플릿</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
/* 18-second vertical starter, not a fixed design. Copy to contents/<folder>/motion.html, rewrite the text with verified
   facts only, put photos next to it (photo-1.jpg …) and drop the `ph` class, then:
     node tools/motion/record.mjs contents/<folder>/motion.html   → motion.mp4
   Timing: each scene sets --at (start) and --len (length); an animated child starts at --at + --d.
   Only CSS animations move: the recorder pauses and seeks them frame by frame (no JS timers, no <video>).
   Platform buttons and captions cover the edges: keep text inside x 60–900, y 200–1480. */
:root{--accent:#ff6b1a;--ink:#1d1b17;--paper:#f6f3ec;--card:#fffdf8;--muted:#837d72}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{background:var(--ink);font-family:Pretendard,"Malgun Gothic",sans-serif;color:var(--ink);letter-spacing:-1px;word-break:keep-all}
em{font-style:normal;color:var(--accent)}

/* A scene is visible only while its own animation runs: hard cuts at --at and --at + --len. */
.scene{position:absolute;inset:0;overflow:hidden;opacity:0;animation:show var(--len) linear var(--at)}
@keyframes show{from,to{opacity:1}}

/* Entrances. `from` only, so each element lands on its own resting style (including any rotate). */
.up,.pop,.slide-in,.fade,.drop{animation-duration:.6s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;animation-delay:calc(var(--at) + var(--d,0s))}
.up{animation-name:up}           @keyframes up{from{opacity:0;transform:translateY(80px)}}
.pop{animation-name:pop;animation-timing-function:cubic-bezier(.3,1.6,.5,1)} @keyframes pop{from{opacity:0;transform:scale(.3)}}
.slide-in{animation-name:slide-in;animation-duration:.8s} @keyframes slide-in{from{opacity:0;transform:translateX(360px) rotate(10deg)}}
.drop{animation-name:drop}       @keyframes drop{from{opacity:0;transform:translateY(-120px)}}
.fade{animation-name:fade}       @keyframes fade{from{opacity:0}}

/* Photos: slow zoom for the whole scene. A missing file falls back to the gradient. */
.photo{position:absolute;inset:0;background:center/cover no-repeat;animation:zoom var(--len) linear var(--at) both}
@keyframes zoom{from{transform:scale(1.14)}to{transform:scale(1)}}
.ph::after{content:attr(data-label) " 자리";position:absolute;inset:0;display:grid;place-items:center;font-size:44px;font-weight:800;color:rgba(255,255,255,.55)}

.disclosure{position:absolute;left:60px;right:180px;top:200px;z-index:2;padding:16px 22px;border-radius:18px;background:rgba(0,0,0,.42);color:rgba(255,255,255,.92);font-size:29px;line-height:1.45;font-weight:600;letter-spacing:-.5px}
.tag{display:inline-block;background:var(--accent);color:#fff;font-size:40px;font-weight:800;padding:12px 30px;border-radius:999px;letter-spacing:0}
h1{font-size:136px;line-height:1.06;letter-spacing:-6px;font-weight:900}
h2{font-size:116px;line-height:1.08;letter-spacing:-5px;font-weight:900}
h1 span,h2 span{display:block}
.num{font-size:200px;line-height:1;font-weight:900;letter-spacing:-8px;color:var(--accent)}
.say{font-size:46px;line-height:1.4;font-weight:700;letter-spacing:-1.5px}

/* 01 hook (0–3s): full-bleed photo, headline at the bottom of the safe area. */
.hook::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,0) 20%,rgba(0,0,0,0) 42%,rgba(0,0,0,.82) 78%)}
.hook .photo{background-image:url(photo-1.jpg),linear-gradient(150deg,#ffb47a,#ff6b1a 45%,#3a1d0c)}
.hook .text{position:absolute;z-index:2;left:72px;right:180px;bottom:440px;color:#fff}
.hook h1{margin:30px 0 26px}
.hook .say{color:rgba(255,255,255,.85);font-size:40px}

/* 02 first point (3–7s): paper, number, photo card sliding in. */
.point{background:var(--paper);padding:210px 72px 0}
.point h2{margin-top:6px}
.card{position:absolute;left:150px;top:820px;width:800px;height:520px;border-radius:48px;overflow:hidden;transform:rotate(-3deg);box-shadow:0 30px 70px rgba(29,27,23,.28)}
.point .card .photo{background-image:url(photo-2.jpg),linear-gradient(150deg,#c9c0b0,#837d72)}
.point .say{position:absolute;left:72px;right:180px;top:1380px;color:var(--muted)}

/* 03 second point (7–12s): dark, photo on top, chips one by one. */
.dark{background:var(--ink);color:#fff}
.dark .frame{position:absolute;left:60px;right:60px;top:200px;height:640px;border-radius:48px;overflow:hidden}
.dark .frame .photo{background-image:url(photo-3.jpg),linear-gradient(150deg,#5b5247,#1d1b17)}
.dark .text{position:absolute;left:72px;right:180px;top:900px}
.dark .num{font-size:120px;letter-spacing:-5px}
.chips{display:flex;gap:18px;flex-wrap:wrap;margin-top:44px}
.chips span{background:#fff;color:var(--ink);font-size:44px;font-weight:800;padding:14px 30px;border-radius:999px}

/* 04 link (12–18s): accent, profile-link call, arrow toward the username corner. */
.cta{background:var(--accent);color:#fff}
.cta .thumb{position:absolute;left:72px;top:420px;width:300px;height:300px;border-radius:40px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.cta .thumb .photo{background-image:url(photo-1.jpg),linear-gradient(150deg,#ffd2ae,#b84a0c)}
.cta .name{position:absolute;left:400px;right:180px;top:470px;font-size:40px;line-height:1.35;font-weight:700}
.cta .text{position:absolute;left:72px;right:120px;top:800px}
.cta mark{background:var(--ink);color:#fff;padding:0 18px;border-radius:24px;box-decoration-break:clone}
.cta .say{margin-top:40px;color:rgba(255,255,255,.88)}
.arrow{position:absolute;left:80px;top:1300px;width:150px;height:150px;animation:nudge .7s ease-in-out calc(var(--at) + 1.2s) infinite alternate both}
@keyframes nudge{from{transform:translate(0,0)}to{transform:translate(-18px,26px)}}
</style></head>
<body data-duration="18">

<section class="scene hook" style="--at:0s;--len:3s">
  <div class="photo ph" data-label="상품 사진 1"></div>
  <p class="disclosure fade">이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>
  <div class="text">
    <span class="tag pop">살림 PICK</span>
    <h1><span class="up" style="--d:.1s">냉장고 정리,</span><span class="up" style="--d:.25s"><em>이거 하나로</em></span></h1>
    <p class="say fade" style="--d:.6s">예시 상품 · 접이식 실리콘 밀폐용기</p>
  </div>
</section>

<section class="scene point" style="--at:3s;--len:4s">
  <p class="num pop">01</p>
  <h2><span class="up" style="--d:.15s">접으면</span><span class="up" style="--d:.3s"><em>납작해져요</em></span></h2>
  <div class="card slide-in" style="--d:.45s"><div class="photo ph" data-label="상품 사진 2"></div></div>
  <p class="say up" style="--d:1.1s">안 쓸 때는 접어서 서랍에 보관</p>
</section>

<section class="scene dark" style="--at:7s;--len:5s">
  <div class="frame drop"><div class="photo ph" data-label="상품 사진 3"></div></div>
  <div class="text">
    <p class="num pop" style="--d:.2s">02</p>
    <h2><span class="up" style="--d:.35s">크기별</span><span class="up" style="--d:.5s"><em>4종 구성</em></span></h2>
    <div class="chips"><span class="pop" style="--d:1.2s">반찬</span><span class="pop" style="--d:1.45s">남은 국</span><span class="pop" style="--d:1.7s">과일</span></div>
  </div>
</section>

<section class="scene cta" style="--at:12s;--len:6s">
  <p class="disclosure fade">이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>
  <div class="thumb pop" style="--d:.1s"><div class="photo ph" data-label="사진"></div></div>
  <p class="name fade" style="--d:.3s">예시 상품<br>접이식 실리콘 밀폐용기</p>
  <div class="text">
    <h2><span class="up" style="--d:.4s">상품 링크는</span><span class="up" style="--d:.55s"><mark>프로필 링크</mark>에서</span></h2>
    <p class="say fade" style="--d:1s">저장해두고 필요할 때 꺼내보세요</p>
  </div>
  <svg class="arrow" viewBox="0 0 100 100" aria-hidden="true"><path d="M85 15 L22 78 M22 78 L22 38 M22 78 L62 78" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>
</section>

</body></html>
