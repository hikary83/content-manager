<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HIKARY 콘텐츠 기록</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"><link rel="stylesheet" href="css/app.css?v=2.0.0"></head>
<body>
<header class="top"><a class="brand" href="./"><b>HIKARY</b><span>콘텐츠 기록 · v2.0.0</span></a><div class="top-links"><span id="connectionState" class="conn">연결 확인 중…</span><a href="https://docs.google.com/spreadsheets/d/1ZSB7FBZTWdT_eLlo3kpom-u2yM5UwHitG059Zci6TUc/edit" target="_blank" rel="noreferrer">운영대장 ↗</a></div></header>
<main>
<div id="notice" role="status" aria-live="polite" hidden></div>
<section class="intro"><h1>만든 콘텐츠와<br>업로드 기록</h1><p>콘텐츠는 Claude에서 만들고 「등록해줘」로 여기에 남깁니다. 올린 뒤에는 플랫폼별로 업로드 기록을 남겨주세요.</p></section>
<section class="stats" aria-label="요약"><div><strong id="statContents">–</strong><span>콘텐츠</span></div><div><strong id="statWaiting">–</strong><span>아직 안 올림</span></div><div><strong id="statPosted">–</strong><span>올린 게시물</span></div></section>
<section class="toolbar"><input id="search" type="search" placeholder="상품명·카테고리 검색" aria-label="콘텐츠 검색"><div id="filters" class="segments" role="group" aria-label="보기"><button type="button" class="on" data-filter="전체">전체</button><button type="button" data-filter="쇼츠">쇼츠</button><button type="button" data-filter="캐러셀">캐러셀</button><button type="button" data-filter="안 올림">안 올림</button></div><button id="refresh" type="button" class="ghost">새로고침</button></section>
<section id="entries" class="entries"></section>
</main>
<dialog id="detailDialog"><form id="detailForm"><div class="dialog-head"><div><small id="detailMeta"></small><h2>콘텐츠 보기 · 수정</h2></div><button id="detailClose" type="button" class="icon" aria-label="닫기">✕</button></div>
<div class="dialog-body"><div class="grid2"><label>상품명<input id="d-productName" required maxlength="200"></label><label>카테고리<input id="d-category" required maxlength="80" list="categories"></label></div>
<datalist id="categories"><option>여행</option><option>생활</option><option>가전·디지털</option><option>뷰티</option><option>식품</option><option>체험·문화</option><option>기타</option></datalist>
<div class="grid2"><label>원본 링크<input id="d-sourceUrl" type="url" required maxlength="2000"></label><label>변환 링크<input id="d-affiliateUrl" type="url" maxlength="2000" placeholder="쿠팡 파트너스 링크"></label></div>
<label>대본 · 문구<textarea id="d-script" rows="8" required maxlength="12000"></textarea></label>
<div class="copy-head"><label for="d-youtube">YouTube 게시글</label><button type="button" class="ghost small" data-copy="d-youtube">복사</button></div><textarea id="d-youtube" rows="4" maxlength="12000"></textarea>
<div class="copy-head"><label for="d-instagram">Instagram 게시글</label><button type="button" class="ghost small" data-copy="d-instagram">복사</button></div><textarea id="d-instagram" rows="4" maxlength="12000"></textarea>
<div class="copy-head"><label for="d-tiktok">TikTok 게시글</label><button type="button" class="ghost small" data-copy="d-tiktok">복사</button></div><textarea id="d-tiktok" rows="4" maxlength="12000"></textarea>
<label>비고<textarea id="d-notes" rows="3" maxlength="5000"></textarea></label></div>
<div class="dialog-foot"><button id="detailDelete" type="button" class="danger">삭제</button><button type="submit">저장</button></div></form></dialog>
<dialog id="uploadDialog"><form id="uploadForm"><div class="dialog-head"><div><small id="uploadTarget"></small><h2>업로드 기록</h2></div><button id="uploadClose" type="button" class="icon" aria-label="닫기">✕</button></div>
<div class="dialog-body"><div id="uploadPlatforms" class="segments wide" role="radiogroup" aria-label="플랫폼"><label><input type="radio" name="platform" value="youtube"><span>YouTube</span></label><label><input type="radio" name="platform" value="instagram"><span>Instagram</span></label><label><input type="radio" name="platform" value="tiktok"><span>TikTok</span></label></div>
<label>업로드 여부<select id="uploadStatus"><option>미업로드</option><option>업로드완료</option><option>보류</option></select></label>
<div class="grid2"><label>업로드일<input id="uploadDate" type="date"></label><label>게시물 링크<input id="uploadLink" type="url" maxlength="2000" placeholder="https://"></label></div>
<p class="hint">링크를 넣으면 업로드완료로 저장돼요. 올렸는데 날짜를 비워 두면 오늘 날짜로 남깁니다.</p></div>
<div class="dialog-foot"><button id="uploadClear" type="button" class="danger">이 플랫폼 기록 지우기</button><button type="submit">저장</button></div></form></dialog>
<script src="js/config.js?v=2.0.0"></script><script src="js/app.js?v=2.0.0"></script></body></html>
